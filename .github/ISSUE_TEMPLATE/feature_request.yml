name: Feature or diagnostic request
description: A new check, component idiom, command or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today, or what an agent gets wrong when building views. A concrete case helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What PDK should report or do. For a diagnostic, the pointer it would point to and the hint it would give.
  - type: input
    id: versions
    attributes:
      label: Perspective version where you saw it
