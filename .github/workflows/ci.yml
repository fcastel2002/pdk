name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # Without an Ignition install there is no schema bundle: the tests that need it are skipped.
      - name: Test
        run: uv run pytest
      - name: Installer syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh
