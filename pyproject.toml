[project]
name = "pdk-perspective"
version = "0.1.0"
description = "PDK for Ignition Perspective: lets an AI agent build, validate, deploy and inspect Perspective views on a development gateway."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Francisco Castel" }]
requires-python = ">=3.12"
keywords = ["ignition", "perspective", "scada", "hmi", "mcp", "agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=2.1,<3",
    "playwright>=1.58,<2",
]

[project.urls]
Homepage = "https://github.com/fcastel2002/pdk"
Issues = "https://github.com/fcastel2002/pdk/issues"
Changelog = "https://github.com/fcastel2002/pdk/blob/main/CHANGELOG.md"

[project.scripts]
pdk = "pdk.cli:main"
pdk-mcp = "pdk.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinx-argparse>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pdk"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m \"not gateway\""
markers = ["gateway: needs the pdk-gateway module running on the local gateway (uv run pytest -m gateway)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures", "schemas"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
